# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
    push:
        branches: main
        tags: v*.*.*
    pull_request: 
        types:
            - synchronize
            - opened
            - reopened
    repository_dispatch:
      types: [EffectiveRange/packaging-tools]
    
jobs:
    prepare_release:
      name: Prepare
      uses: EffectiveRange/ci-workflows/.github/workflows/accept-repository-dispatch.yaml@v1_repodispatch
      with:
        versioned_dispatch_type: EffectiveRange/packaging-tools            
    build_image:
        name: Publish image to dockerhub
        runs-on: ubuntu-latest
        needs: prepare_release
        permissions:
          contents: read
        steps:
        - name: Check out the repo
          uses: actions/checkout@v4
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME  }}
            password: ${{ secrets.DOCKERHUB_TOKEN  }}
        - name: Extract metadata (tags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v4
          with:
              images: |
                effectiverange/devc-erdev-vscodeext
              flavor: |
                latest=true
        - name: Build and push Docker images
          id: dbuild
          uses: docker/build-push-action@v5
          with:
            context: .
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            build-args: |
              PACKAGING_TOOLS_VER=${{ needs.prepare_release.outputs.base_version }}

    dispatch_downstream:
      name: Dispatch downstream repo
      if: github.event_name != 'pull_request'
      needs: [prepare_release,build_image]
      uses: EffectiveRange/ci-workflows/.github/workflows/repository-dispatch.yaml@v1_repodispatch
      secrets: inherit
      with:
        downstream_repo: vscodeext-er-dev
        event_type: ${{ github.repository }}
        version: ${{ needs.prepare_release.outputs.tag }}    